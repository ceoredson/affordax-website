{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block og_type %}article{% endblock %}
{% block extra_head %}
<meta property="article:published_time" content="{{ page.publication_date|date:'Y-m-d' }}">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Article","headline":"{{ page.title|escapejs }}","description":"{{ page.summary|escapejs }}","datePublished":"{{ page.publication_date|date:'Y-m-d' }}","mainEntityOfPage":"{{ configured_public_site_url|escapejs }}{{ request.path|escapejs }}","author":{"@type":"Organization","name":"Affordax"},"publisher":{"@type":"Organization","name":"Affordax","url":"{{ configured_public_site_url|escapejs }}/"}}</script>
{% endblock %}
{% block content %}
<article class="article"><header class="article__header shell"><a class="text-link" href="{{ page.get_parent.url }}">← All field notes</a><p class="eyebrow">{{ page.publication_date|date:"d F Y" }}</p><h1>{{ page.title }}</h1><p>{{ page.summary }}</p></header><div class="article__body rich-text">{{ page.body|richtext }}</div></article>
{% endblock %}
