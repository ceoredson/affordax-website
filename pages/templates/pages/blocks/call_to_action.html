<section class="section"><div class="shell"><div class="cta" data-reveal><div>{% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}<h2>{{ value.heading }}</h2><p>{{ value.text }}</p></div><div class="action-row"><a class="button button--light" href="{{ value.primary.url }}">{{ value.primary.label }} <span>→</span></a>{% if value.secondary.label %}<a class="text-link text-link--light" href="{{ value.secondary.url }}">{{ value.secondary.label }}</a>{% endif %}</div></div></div></section>
