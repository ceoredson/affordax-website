<section class="section section--paper"><div class="shell"><div class="section-heading" data-reveal>{% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}<h2>{{ value.heading }}</h2>{% if value.intro %}<p>{{ value.intro }}</p>{% endif %}</div><div class="feature-grid">{% for feature in value.features %}<article class="feature" data-reveal>{% if feature.number %}<span>{{ feature.number }}</span>{% endif %}<h3>{{ feature.title }}</h3><p>{{ feature.text }}</p></article>{% endfor %}</div></div></section>
